# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "local"
hooks = [
  {
    id = "sync-branch",
    name = "Branch up to date",
    language = "system",
    entry = "go run .",
    pass_filenames = false,
    always_run = true
  }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "check-pre-push-hook",
    name = "pre-push hook installed",
    language = "script",
    entry = "scripts/check-pre-push-hook.sh",
    pass_filenames = false,
    always_run = true
  }
]

# Block commits that contain secrets. betterleaks is pinned in mise.toml.
[[repos]]
repo = "local"
hooks = [
  {
    id = "betterleaks",
    name = "betterleaks (secrets)",
    entry = "mise exec betterleaks -- betterleaks git --pre-commit --staged --redact --verbose",
    language = "system",
    pass_filenames = false
  }
]
